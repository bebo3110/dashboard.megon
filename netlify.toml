[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
